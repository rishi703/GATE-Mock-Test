<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GATE PrepHub</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .login-page {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background:
                radial-gradient(circle at 15% 20%, rgba(77, 124, 254, 0.15) 0, transparent 25%),
                radial-gradient(circle at 85% 80%, rgba(77, 124, 254, 0.15) 0, transparent 25%),
                #0f172a;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .login-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-heading .login-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(77, 124, 254, 0.15);
            color: #4d7cfe;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .login-heading h1 {
            font-size: 32px;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .login-heading p {
            color: #94a3b8;
            font-size: 14px;
        }

        .auth-message {
            display: none;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .auth-message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .auth-message.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #334155;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #0f172a;
            color: #f1f5f9;
        }

        .form-group input:focus {
            border-color: #4d7cfe;
            box-shadow: 0 0 0 3px rgba(77, 124, 254, 0.25);
        }

        .login-submit {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 9px;
            background: #4d7cfe;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-submit:hover {
            background: #3b6ce6;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(77, 124, 254, 0.25);
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }

        .login-footer a {
            color: #4d7cfe;
            font-weight: 700;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
        }

        .back-home a:hover {
            color: #4d7cfe;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 30px 22px;
            }

            .login-heading h1 {
                font-size: 28px;
            }
        }

    </style>

</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="nav-left">
            <div class="logo">
                GATE<span>CSE</span>
            </div>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#subjects">Subjects</a>
            <a href="index.html#about">About</a>
            <a href="history">History</a>
        </nav>

    </header>


    <!-- Login Section -->
    <main class="login-page">

        <div class="login-container">

            <div class="login-card">

                <div class="login-heading">

                    <div class="login-badge">
                        GATE PREPHUB
                    </div>

                    <h1>Welcome Back</h1>

                    <p>
                        Login to continue your GATE preparation.
                    </p>

                </div>


                <div id="auth-message" class="auth-message"></div>


                <form action="login" method="post">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <button type="submit" class="login-submit">
                        Login
                    </button>

                </form>


                <div class="login-footer">

                    Don't have an account?
                    <a href="signup.html">Create Account</a>

                </div>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to GATE PrepHub
                </a>

            </div>

        </div>

    </main>

    <script>

        (function () {

            var params =
                new URLSearchParams(window.location.search);

            var box =
                document.getElementById("auth-message");

            var errorMessages = {
                empty: "Please fill in all fields.",
                invalid: "Invalid username or password."
            };

            var successMessages = {
                registered:
                    "Account created successfully! " +
                    "You can now log in."
            };

            var error = params.get("error");
            var success = params.get("success");

            if (error && errorMessages[error]) {

                box.textContent = errorMessages[error];
                box.className = "auth-message error";
                box.style.display = "block";

            } else if (success && successMessages[success]) {

                box.textContent = successMessages[success];
                box.className = "auth-message success";
                box.style.display = "block";
            }

            // Clean the URL so a refresh doesn't
            // re-show the same message
            if (error || success) {
                window.history.replaceState(
                    null, "", window.location.pathname);
            }
        })();

    </script>

</body>

</html>
