<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | GATE PrepHub</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .signup-page {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background:
                radial-gradient(circle at 85% 20%, rgba(77, 124, 254, 0.15) 0, transparent 25%),
                radial-gradient(circle at 15% 80%, rgba(77, 124, 254, 0.15) 0, transparent 25%),
                #0f172a;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
        }

        .signup-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .signup-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(77, 124, 254, 0.15);
            color: #4d7cfe;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .signup-heading h1 {
            font-size: 32px;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .signup-heading p {
            color: #94a3b8;
            font-size: 14px;
        }

        .auth-message {
            display: none;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .auth-message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .auth-message.success {
            background: #e8f7ee;
            border: 1px solid #b2e0c3;
            color: #177245;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #334155;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #0f172a;
            color: #f1f5f9;
        }

        .form-group input:focus {
            border-color: #4d7cfe;
            box-shadow: 0 0 0 3px rgba(77, 124, 254, 0.25);
        }

        .signup-submit {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 9px;
            background: #4d7cfe;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .signup-submit:hover {
            background: #3b6ce6;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(77, 124, 254, 0.25);
        }

        .signup-footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }

        .signup-footer a {
            color: #4d7cfe;
            font-weight: 700;
            text-decoration: none;
        }

        .signup-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
        }

        .back-home a:hover {
            color: #4d7cfe;
        }

        @media (max-width: 500px) {

            .signup-card {
                padding: 30px 22px;
            }

            .signup-heading h1 {
                font-size: 28px;
            }
        }

    </style>

</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="nav-left">
            <div class="logo">
                GATE<span>CSE</span>
            </div>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#subjects">Subjects</a>
            <a href="index.html#about">About</a>
            <a href="history">History</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- Sign Up Section -->
    <main class="signup-page">

        <div class="signup-container">

            <div class="signup-card">

                <div class="signup-heading">

                    <div class="signup-badge">
                        GATE PREPHUB
                    </div>

                    <h1>Create Account</h1>

                    <p>
                        Create your account and start preparing for GATE.
                    </p>

                </div>


                <div id="auth-message" class="auth-message"></div>


                <form action="signup" method="post">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required>

                    </div>


                    <button type="submit" class="signup-submit">
                        Create Account
                    </button>

                </form>


                <div class="signup-footer">

                    Already have an account?
                    <a href="login.html">Login</a>

                </div>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to GATE PrepHub
                </a>

            </div>

        </div>

    </main>

    <script>

        (function () {

            var params =
                new URLSearchParams(window.location.search);

            var box =
                document.getElementById("auth-message");

            var errorMessages = {
                empty: "Please fill in all fields.",
                email: "Please enter a valid email address.",
                usernameformat:
                    "Username must be 3-20 characters " +
                    "and contain only letters, numbers " +
                    "or underscores.",
                passwordshort:
                    "Password must be at least " +
                    "6 characters long.",
                password:
                    "Passwords do not match. " +
                    "Please try again.",
                username:
                    "That username is already taken. " +
                    "Please choose another."
            };

            var error = params.get("error");

            if (error && errorMessages[error]) {

                box.textContent = errorMessages[error];
                box.className = "auth-message error";
                box.style.display = "block";

                window.history.replaceState(
                    null, "", window.location.pathname);
            }
        })();

    </script>

</body>

</html>
